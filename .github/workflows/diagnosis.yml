name: LVCE typing diagnosis
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    name: LVCE idle controls and profile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop and perf
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic python3 curl xz-utils xvfb xauth xdotool x11-utils openbox geany \
            libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6 libxkbcommon-x11-0 libxkbfile1 libsecret-1-0 \
            mesa-utils mesa-vulkan-drivers libvulkan1 libasound2t64
          sudo sysctl kernel.perf_event_paranoid=-1
      - name: Install pinned ARM artifact
        run: python3 scripts/install.py --editors "lvce"
      - name: Measure matched idle and typing trials
        env:
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_COMMIT: ${{ github.sha }}
        run: |
          PERF=$(find -L /usr/lib/linux-tools -name perf -type f | sort | tail -n 1)
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/diagnose.sh "$PERF"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lvce-diagnosis
          path: results/
          if-no-files-found: error
          retention-days: 90
